name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run pack:check
      - run: npm run smoke -w @harness-sdk/example-tui
      - if: runner.os == 'Linux'
        run: xvfb-run -a npm run smoke -w @harness-sdk/example-electron
      - if: runner.os != 'Linux'
        run: npm run smoke -w @harness-sdk/example-electron
